[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "verifact-cli"
version = "0.6.0"
description = "Verifact: clear link guidance and evidence-based website configuration checks"
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = []
authors = [{name = "qazaqqyzzz"}]

[project.scripts]
verifact = "verifact.cli:main"

[tool.setuptools.packages.find]
include = ["verifact*"]

[tool.setuptools.package-data]
verifact = ["static/*.html", "static/*.css", "static/*.js", "static/fonts/*.ttf", "static/fonts/*.txt"]
